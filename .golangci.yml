# golangci-lint configuration (v2 format)
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - revive
    - misspell
    - bodyclose
    - gocritic
    - gosec
    - nilerr
    - prealloc
    - unconvert
    - unparam

formatters:
  enable:
    - gofmt
    - goimports

exclusions:
  generated: lax
  paths:
    - gen
    - vendor
  rules:
    - path: _test\.go
      linters:
        - gosec
        - gocritic
