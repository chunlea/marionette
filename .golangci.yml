# golangci-lint configuration (v2 format)
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - revive
    - misspell
    - bodyclose
    - gocritic
    - nilerr
    - unconvert
    - unparam
  disable:
    # Disabled due to many false positives in existing code
    - gosec
    - prealloc

formatters:
  enable:
    - gofmt
    - goimports

exclusions:
  generated: lax
  paths:
    - gen
    - vendor
  rules:
    - path: _test\.go
      linters:
        - gocritic
        - revive
    # Stutter warnings - these are intentional naming choices
    - linters:
        - revive
      text: "stutters"
    # var-naming for intentional underscore usage
    - linters:
        - revive
      text: "var-naming"
    # unused-parameter - context often passed for future use
    - linters:
        - revive
      text: "unused-parameter"
    # package-comments - not enforcing package docs
    - linters:
        - revive
      text: "package-comments"
