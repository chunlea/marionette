# golangci-lint configuration (v2 format)
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - misspell
    - bodyclose
    - nilerr
    - unconvert
  disable:
    # Disabled due to many false positives in existing code
    - gosec
    - prealloc
    # Disabled - too strict for test helpers
    - unparam
    # Disabled - too many stuttering warnings for intentional naming
    - revive
    # Disabled - deprecated Docker SDK types are intentional until upgrade
    - staticcheck
    # Disabled - many false positives in test files
    - gocritic

formatters:
  enable:
    - gofmt
    - goimports

exclusions:
  generated: lax
  paths:
    - gen
    - vendor
  rules:
    # Exclude all linters in test files that cause noise
    - path: _test\.go
      linters:
        - unused
