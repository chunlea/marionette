# golangci-lint configuration (v2 format)
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - revive
    - misspell
    - bodyclose
    - gocritic
    - nilerr
    - unconvert
  disable:
    # Disabled due to many false positives in existing code
    - gosec
    - prealloc
    # Disabled - too strict for test helpers
    - unparam

formatters:
  enable:
    - gofmt
    - goimports

exclusions:
  generated: lax
  paths:
    - gen
    - vendor
  rules:
    # Exclude all linters in test files that cause noise
    - path: _test\.go
      linters:
        - gocritic
        - revive
        - unparam
        - unused
    # Stutter warnings - these are intentional naming choices (ProviderType, SandboxMode, etc.)
    - linters:
        - revive
      text: "stutters"
    # var-naming for intentional underscore usage (default_ field)
    - linters:
        - revive
      text: "var-naming"
    # unused-parameter - context often passed for future use
    - linters:
        - revive
      text: "unused-parameter"
    # package-comments - not enforcing package docs
    - linters:
        - revive
      text: "package-comments"
    # redefines-builtin-id - sometimes intentional (copy variable)
    - linters:
        - revive
      text: "redefines-builtin-id"
    # empty-block - acceptable in test channel draining
    - linters:
        - revive
      text: "empty-block"
    # SA1019 - Docker SDK deprecations (we'll update when ready)
    - linters:
        - staticcheck
      text: "SA1019"
    # S1011 - loop simplification suggestions
    - linters:
        - staticcheck
      text: "S1011"
