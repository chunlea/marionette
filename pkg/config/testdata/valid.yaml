# Valid test configuration
server:
  api:
    port: 8080
    host: "0.0.0.0"
  admin:
    port: 8081
    host: "127.0.0.1"
  grpc:
    port: 9090
    host: "0.0.0.0"

providers:
  default: docker
  docker:
    image: "marionette/agent:latest"
    network: "marionette-network"

storage:
  provider: local
  local:
    path: "./data/storage"

logging:
  level: debug
  format: console

dev:
  hot_reload: true
  skip_tls: true
