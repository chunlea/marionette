        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tunnels/{tunnelID}/:
    get:
      tags:
        - Tunnels
      summary: Tunnel entry point
      description: 'Serves the tunnelled application. Authenticated by the tunnel token (Authorization: Bearer, the X-Marionette-Tunnel-Token header, or HTTP basic with the token as the password) unless the tunnel is public.'
      operationId: openTunnel
      parameters:
        - name: tunnelID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Whatever the tunnelled service returned.
          content:
            '*/*': {}
        "404":
          description: No such resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tunnels/{tunnelID}/{path}:
    get:
      tags:
        - Tunnels
      summary: Tunnel passthrough
      description: Proxies any path, and any method, to the tunnelled service. WebSocket upgrades are relayed too.
      operationId: proxyThroughTunnel
      parameters:
        - name: tunnelID
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Whatever the tunnelled service returned.
          content:
            '*/*': {}
        "404":
          description: No such resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
