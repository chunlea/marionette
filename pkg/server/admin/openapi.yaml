          description: An HTML page rendering this document.
          content:
            text/html: {}
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      tags:
        - Service
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health/live:
    get:
      tags:
        - Service
      summary: Liveness probe with per-check detail
      description: Served only when a health service is configured.
      operationId: getHealthLive
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health/ready:
    get:
      tags:
        - Service
      summary: Readiness probe
      description: Reports the dependencies the server needs before it can serve traffic.
      operationId: getHealthReady
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /healthz:
    get:
      tags:
        - Service
      summary: Liveness probe (Kubernetes spelling)
      operationId: getHealthz
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /openapi.yaml:
    get:
      tags:
        - Service
      summary: This document
      operationId: getOpenapiYaml
      responses:
        "200":
          description: The OpenAPI description of the admin API.
          content:
            application/yaml: {}
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /{path}:
    get:
      tags:
        - Service
      summary: The dashboard
      description: Everything not matched above serves the embedded single-page app, falling back to index.html so client-side routes deep-link. This origin also forwards /api/v1 to the public API, so the browser has one origin for both.
      operationId: getDashboard
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The dashboard, or one of its assets.
          content:
            text/html: {}
        "404":
          description: No such resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: An error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
