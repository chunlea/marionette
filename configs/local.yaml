# Marionette Local Development Configuration
# Sensitive values should be set via environment variables (MARIONETTE_* prefix)

server:
  api:
    port: 8080
    host: "0.0.0.0"
  admin:
    port: 8081
    host: "127.0.0.1"
    # The admin API mints API keys, registers runners and reads every session.
    # It fails closed: the server refuses to start unless basic auth credentials
    # are present in the environment:
    #   MARIONETTE_UI_USERNAME=admin MARIONETTE_UI_PASSWORD=<secret>
    # To run without authentication in local development, start the server with
    # --dev-insecure-admin. Never do that on anything reachable from a network.
  grpc:
    port: 9090
    host: "0.0.0.0"

# Provider configuration
providers:
  default: docker
  docker:
    host: "unix:///var/run/docker.sock"
    image: "marionette/agent:latest"
    network: "marionette-network"
    resources:
      memory: "2g"
      cpus: "2"

# Storage configuration
storage:
  provider: local
  local:
    path: "./data/storage"
  workspace:
    base_dir: "./data/workspaces"

  # Log archiving moves finished sessions' logs out of PostgreSQL and into the
  # object store above. It is off by default; turning it on is also what makes
  # log retention possible, because the partition maintainer will not drop a day
  # no archive covers.
  log_archive:
    enabled: false
    # interval: 1h                 # how often a pass runs
    # terminated_after: 15m        # grace window after a session terminates
    # idle_after: 0                # also archive live sessions quiet this long
    # retention: 2160h             # 90 days; how long an archive lives (0 = forever)
    # retention_days: 30           # drop log partitions older than this

# Logging configuration
logging:
  level: debug
  format: console  # console or json

# Development settings
dev:
  hot_reload: true
  skip_tls: true  # Skip TLS verification in development

# Tunnel subsystem (HTTP proxy + TCP relay)
tunnels:
  enabled: true

# Streaming subsystem (desktop/browser)
# Frozen: the SFU has no media source, no renegotiation and never reads RTCP,
# so it cannot deliver a frame. Leave disabled unless you are working on it.
streaming:
  enabled: false
