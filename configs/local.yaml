# Marionette Local Development Configuration
# Sensitive values should be set via environment variables (MARIONETTE_* prefix)

server:
  api:
    port: 8080
    host: "0.0.0.0"
  admin:
    port: 8081
    host: "127.0.0.1"
    # The admin API mints API keys, registers runners and reads every session.
    # It fails closed: the server refuses to start unless basic auth credentials
    # are present in the environment:
    #   MARIONETTE_UI_USERNAME=admin MARIONETTE_UI_PASSWORD=<secret>
    # To run without authentication in local development, start the server with
    # --dev-insecure-admin. Never do that on anything reachable from a network.
  grpc:
    port: 9090
    host: "0.0.0.0"

# Provider configuration
providers:
  default: docker
  docker:
    host: "unix:///var/run/docker.sock"
    image: "marionette/agent:latest"
    network: "marionette-network"
    resources:
      memory: "2g"
      cpus: "2"

# Storage configuration
storage:
  provider: local
  local:
    path: "./data/storage"
  workspace:
    base_dir: "./data/workspaces"

# Logging configuration
logging:
  level: debug
  format: console  # console or json

# Development settings
dev:
  hot_reload: true
  skip_tls: true  # Skip TLS verification in development
