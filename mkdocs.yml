site_name: Marionette
site_description: Remote agent orchestration and observability platform for AI coding agents
site_url: https://chunlea.github.io/marionette
repo_url: https://github.com/chunlea/marionette
repo_name: chunlea/marionette
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.svg
  favicon: assets/favicon.ico

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chunlea/marionette

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mermaid-zoom.js

copyright: Copyright &copy; 2024 Marionette

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Configuration: getting-started/configuration.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Sessions & Tasks: concepts/sessions-tasks.md
      - Providers: concepts/providers.md
      - Workspaces: concepts/workspaces.md
  - Guides:
      - CLI Reference: guides/cli-reference.md
      - API Reference: guides/api-reference.md
      - Agents: guides/agents.md
      - Security: guides/security.md
  - Reference:
      - Database Schema: reference/schema.md
      - ID Generation: reference/id.md
      - gRPC Protocol: reference/grpc-protocol.md
      - Storage: reference/storage.md
  - Development:
      - Contributing: development/contributing.md
      - Roadmap: development/roadmap.md
