# Run the published images instead of building this checkout.
#
#   docker compose -f deploy/docker/docker-compose.yml \
#                  -f deploy/docker/docker-compose.release.yml up -d
#
# Pin a version with MARIONETTE_VERSION (defaults to latest):
#
#   MARIONETTE_VERSION=v0.1.0 docker compose -f ... up -d
#
# `build: !reset null` drops the base file's build section — with both an image
# and a build section, Compose would build the image locally rather than pull
# it. The tag needs Compose v2.24 or newer.
services:
  server:
    image: ghcr.io/chunlea/marionette-server:${MARIONETTE_VERSION:-latest}
    build: !reset null
    pull_policy: always

  agent:
    image: ghcr.io/chunlea/marionette-agent:${MARIONETTE_VERSION:-latest}
    build: !reset null
    pull_policy: always
