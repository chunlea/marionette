# Marionette Server Configuration for Docker
# This file is mounted at /etc/marionette/config.yaml

server:
  api:
    host: "0.0.0.0"
    port: 8080
  admin:
    host: "0.0.0.0"
    port: 8081
  grpc:
    host: "0.0.0.0"
    port: 9090

# Database configuration
# Connection string is set via MARIONETTE_DATABASE_URL environment variable
database:
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: "1h"

# Provider configuration
providers:
  default: docker
  docker:
    host: "unix:///var/run/docker.sock"
    image: "marionette/agent:latest"
    network: "marionette_default"
    isolation:
      # The address a spawned runner dials back on. Without it the server
      # derives one from its own gRPC listener - 127.0.0.1:9090, which inside a
      # runner container is that container, so runners come up and never
      # connect. The server logs a WARN naming this key when it has to guess.
      #
      # "server" is this compose file's service name, resolvable on the compose
      # network. Use host.docker.internal:9090 instead when the server runs on
      # the Docker Desktop host rather than in a container.
      server_url: "server:9090"

# Storage configuration
storage:
  provider: local
  local:
    path: /var/marionette/storage
  workspace:
    base_dir: /var/marionette/workspaces

  # See configs/production.yaml.example for what turning this on commits you to.
  log_archive:
    enabled: false

# Logging configuration
logging:
  level: info
  format: json

# TLS configuration (disabled in development)
tls:
  enabled: false

# Development settings
dev:
  hot_reload: false
  skip_tls: true
