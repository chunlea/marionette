apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: marionette-server
  labels:
    app.kubernetes.io/name: marionette
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: marionette
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from any namespace (for ingress controller)
    - from: []
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 9090
          protocol: TCP
  egress:
    # Allow egress to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres
      ports:
        - port: 5432
          protocol: TCP
    # Allow DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: marionette-agent
  labels:
    app.kubernetes.io/name: marionette
    app.kubernetes.io/component: agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: marionette
      app.kubernetes.io/component: agent
  policyTypes:
    - Ingress
    - Egress
  ingress: []  # No ingress needed for agent
  egress:
    # Allow egress to server gRPC
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: server
      ports:
        - port: 9090
          protocol: TCP
    # Allow DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS (for external API calls)
    - to: []
      ports:
        - port: 443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: marionette
    app.kubernetes.io/component: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: marionette
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only allow from server
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: server
      ports:
        - port: 5432
          protocol: TCP
  egress: []  # No egress needed for PostgreSQL
