{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "marionette.fullname" . }}-server
  labels:
    {{- include "marionette.server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "marionette.server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - port: 8080
          protocol: TCP
        - port: 8081
          protocol: TCP
        - port: 9090
          protocol: TCP
  egress:
    # Allow PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
    # Allow DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
{{- if .Values.agent.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "marionette.fullname" . }}-agent
  labels:
    {{- include "marionette.agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "marionette.agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # Allow server gRPC
    - to:
        - podSelector:
            matchLabels:
              {{- include "marionette.server.selectorLabels" . | nindent 14 }}
      ports:
        - port: 9090
          protocol: TCP
    # Allow DNS
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS
    - to: []
      ports:
        - port: 443
          protocol: TCP
{{- end }}
{{- end }}
