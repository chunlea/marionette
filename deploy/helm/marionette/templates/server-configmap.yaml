apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "marionette.fullname" . }}-config
  labels:
    {{- include "marionette.server.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      api:
        host: "0.0.0.0"
        port: 8080
      admin:
        host: "0.0.0.0"
        port: 8081
      grpc:
        host: "0.0.0.0"
        port: 9090

    database:
      max_open_conns: 25
      max_idle_conns: 5
      conn_max_lifetime: "1h"

    providers:
      default: docker

    storage:
      provider: local
      local:
        path: /var/marionette/storage
      workspace:
        base_dir: /var/marionette/workspaces

    {{- with .Values.server.config.logging }}
    logging:
      {{- toYaml . | nindent 6 }}
    {{- end }}

    {{- with .Values.server.config.tls }}
    tls:
      {{- toYaml . | nindent 6 }}
    {{- end }}
