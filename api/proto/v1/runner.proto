// Marionette gRPC Protocol
// Runner <-> Server communication

syntax = "proto3";

package marionette.v1;

option go_package = "github.com/chunlea/marionette/gen/proto/v1;protov1";

// RunnerService: Internal gRPC for runner <-> server communication
//
// AUTHENTICATION:
// All RPCs require runner authentication via gRPC metadata:
//   - "x-runner-token": Runner token from RegisterRunnerResponse or runner_tokens table
//   - "x-runner-id": Runner ID (validated against token)
//
// For StreamLogs specifically:
//   - First message MUST be StreamLogsInit (validates session/task assignment)
//   - Subsequent messages are LogEntry
//   - Server validates runner_id in LogEntry matches authenticated runner
//   - Server validates tenant_id matches runner's tenant
//
service RunnerService {
  // Bidirectional stream for control messages
  // Auth: x-runner-token, x-runner-id in metadata
  rpc Connect(stream RunnerMessage) returns (stream ServerCommand);

  // Log upload stream (runner -> server)
  // Auth: x-runner-token, x-runner-id in metadata
  // First message must be StreamLogsInit, subsequent are LogEntry
  rpc StreamLogs(stream StreamLogsMessage) returns (StreamLogsResponse);

  // Browser streaming bidirectional stream (runner <-> server)
  // Auth: x-runner-token, x-runner-id in metadata
  // First message from runner MUST be BrowserStreamInit
  // Server sends input events and control commands, runner sends frames
  rpc StreamBrowser(stream RunnerBrowserMessage) returns (stream ServerBrowserMessage);

  // Unary RPCs
  rpc RegisterRunner(RegisterRunnerRequest) returns (RegisterRunnerResponse);
  rpc GetRunnerStatus(GetRunnerStatusRequest) returns (RunnerStatus);
}

//------------------------------------------------------------------------------
// Runner -> Server Messages
//------------------------------------------------------------------------------

message RunnerMessage {
  oneof payload {
    Heartbeat heartbeat = 1;
    TaskProgress task_progress = 2;
    PermissionRequest permission_request = 3;
    TaskCompleted task_completed = 4;
    TaskAccepted task_accepted = 5;
    TaskStarted task_started = 6;
    SessionAttached session_attached = 7;
    SessionSuspended session_suspended = 8;
    ContextUpdate context_update = 9;

    // Tunnel messages (runner-initiated)
    CreateTunnelRequest create_tunnel_request = 10;
    TunnelData tunnel_data = 11;
    CloseTunnel close_tunnel = 12;

    // Android streaming messages
    AndroidStreamStarted android_stream_started = 13;
    AndroidStreamData android_stream_data = 14;
    AndroidStreamStopped android_stream_stopped = 15;

    // Desktop streaming responses
    DesktopStreamStarted desktop_stream_started = 16;
    DesktopStreamStopped desktop_stream_stopped = 17;
    DesktopStreamError desktop_stream_error = 18;
  }
}

message Heartbeat {
  string runner_id = 1;
  string status = 2;        // "idle", "busy", "paused"
  int64 uptime_seconds = 3;
  ResourceUsage resources = 4;
}

message ResourceUsage {
  double cpu_percent = 1;
  int64 memory_bytes = 2;
  int64 disk_bytes = 3;
}

message TaskAccepted {
  string task_id = 1;
  string run_id = 2;
  int32 attempt = 3;
}

message TaskStarted {
  string task_id = 1;
  string run_id = 2;
  int32 attempt = 3;
}

message TaskProgress {
  string task_id = 1;
  string run_id = 2;
  int32 attempt = 3;
  string status = 4;
  int32 progress_percent = 5;
  string current_step = 6;
}

message TaskCompleted {
  string task_id = 1;
  string run_id = 2;
  int32 attempt = 3;
  bool success = 4;
  string error = 5;
  int32 exit_code = 6;
  int64 tokens_input = 7;
  int64 tokens_output = 8;
  bytes context_snapshot = 9;  // JSON context for session restore
}

message PermissionRequest {
  string request_id = 1;
  string task_id = 2;
  string run_id = 3;
  string tool = 4;          // "bash", "edit", "browser"
  string action = 5;        // command or description
  string risk_level = 6;    // "low", "medium", "high", "critical"

  // Timing behavior:
  // - Runner blocks waiting for approval
  // - After suspend_after_seconds, server auto-suspends session (default: 1800 = 30 min)
  // - Permission request remains pending indefinitely until user responds
  // - On session resume, pending approval/denial is delivered to runner
  // - No auto-deny: request stays pending until explicit response or session termination
  int64 suspend_after_seconds = 7;  // Auto-suspend session after this (default: 1800)

  // Context for UI display
  string context = 8;       // Additional context (file path, command args, etc.)
  int64 created_at_unix_ms = 9;
}

message SessionAttached {
  string session_id = 1;
  bool restored = 2;        // true if restored from snapshot
}

// SessionSuspended is sent by runner after completing suspend operation
message SessionSuspended {
  string session_id = 1;

  // Actual strategy that was executed (may differ from requested if fallback)
  string strategy = 2;

  // What was preserved
  bool context_saved = 3;       // Agent context saved to snapshot
  bool workspace_synced = 4;    // Workspace synced to CAS
  string snapshot_id = 5;       // Snapshot ID if created

  // Error if suspend failed
  bool success = 6;
  string error = 7;

  int64 suspended_at_unix_ms = 8;

  // Manifest the runner wrote when it synced the workspace to CAS.
  // Empty when workspace_synced is false.
  string manifest_id = 9;
}

// ContextUpdate is sent by runner to update session context during task execution.
// This allows the server to save context (like Claude Code's conversation_id)
// that's needed for session resume.
message ContextUpdate {
  string session_id = 1;
  string task_id = 2;

  // The context snapshot as JSON bytes.
  // Contains conversation_id from Claude Code's init message.
  bytes context_snapshot = 3;
}

//------------------------------------------------------------------------------
// Tunnel Messages (Runner-Initiated)
//------------------------------------------------------------------------------

// CreateTunnelRequest is sent by runner to request a new tunnel.
// The agent uses this to expose a local port (e.g., a dev server) to users.
message CreateTunnelRequest {
  string request_id = 1;    // Unique ID to correlate with CreateTunnelResponse
  string session_id = 2;
  string type = 3;          // "http", "tcp"
  int32 local_port = 4;     // Port on the runner to tunnel

  // Direction for network policy enforcement
  // "outbound": Agent → External (http, tcp) - agent exposes a port
  // Note: For inbound tunnels (desktop streaming), server uses CreateTunnel
  string direction = 5;
}

// CreateTunnelResponse is sent by server in response to CreateTunnelRequest.
message CreateTunnelResponse {
  string request_id = 1;    // Correlates with the request (optional)
  bool success = 2;
  string error = 3;         // Error message if success is false

  // Tunnel info (only set if success is true)
  string tunnel_id = 4;
  string token = 5;         // Access token for the tunnel (ttok_xxx)
  string public_url = 6;    // Full URL to access the tunnel
  int64 expires_at_unix_ms = 7;
}

// TunnelData carries data between server and runner for an active tunnel.
// Used for both directions: server→runner (incoming request) and runner→server (response).
message TunnelData {
  string tunnel_id = 1;
  string connection_id = 2; // Unique ID for this connection (for multiplexing)
  bytes data = 3;           // Payload data

  // For HTTP tunnels: data contains serialized HTTP request/response
  // For TCP tunnels: data contains raw bytes

  // Connection lifecycle
  bool eof = 4;             // End of data for this direction
}

// CloseTunnel is sent by runner to close a tunnel.
message CloseTunnel {
  string tunnel_id = 1;
  string reason = 2;        // Optional reason for closing
}

//------------------------------------------------------------------------------
// Server -> Runner Commands
//------------------------------------------------------------------------------

message ServerCommand {
  oneof payload {
    ExecuteTask execute_task = 1;
    ApprovePermission approve_permission = 2;
    KillTask kill_task = 3;
    CreateTunnel create_tunnel = 4;
    AttachSession attach_session = 5;
    DetachSession detach_session = 6;

    // Tunnel messages
    CreateTunnelResponse create_tunnel_response = 7;
    TunnelData tunnel_data = 8;

    // Desktop streaming commands
    StartDesktopStream start_desktop_stream = 9;
    StopDesktopStream stop_desktop_stream = 10;
  }
}

message ExecuteTask {
  string task_id = 1;
  string run_id = 2;
  int32 attempt = 3;
  string session_id = 4;
  string prompt = 5;
  string work_dir = 6;
  map<string, string> env = 7;
  SandboxConfig sandbox = 8;

  // Agent config for task execution
  // Note: For new sessions, use AttachSession first.
  // For tasks within existing sessions, agent_config is optional
  // (runner uses previously attached config if not provided).
  AgentConfig agent_config = 9;
}

message AttachSession {
  string session_id = 1;

  // Where the workspace is mounted for this runner. A container sees
  // /workspace; a native runner sees the host path. It is a location, not an
  // identity: every container-mode session sees the same string.
  string workspace_path = 2;

  bytes context_snapshot = 3;
  AgentConfig agent_config = 4;

  // Pending permission requests that were responded to while session was suspended
  // Runner should process these immediately after attach
  repeated PendingPermissionResponse pending_permissions = 5;

  // Identity of the workspace, as opposed to where it happens to be mounted.
  // The runner needs this to key content-addressed storage: keying on
  // workspace_path would collide every container-mode session onto "/workspace".
  string workspace_id = 6;

  // Tenant that owns the session. Chunks are deduplicated per tenant, never
  // across them, so this is part of the CAS key rather than a label.
  // Empty in single-tenant deployments.
  string tenant_id = 7;

  // Manifest to restore the workspace from, as reported by whichever runner
  // last synced it. Empty when the workspace has never been synced, which is
  // the signal to start empty rather than guess. The runner that made a
  // snapshot is the only thing that knew its id and it is gone by now, so the
  // server hands it back here.
  string workspace_manifest_id = 8;
}

// Permission response that was made while session was suspended
message PendingPermissionResponse {
  string request_id = 1;
  bool approved = 2;
  string reason = 3;
  string responded_by = 4;
  int64 responded_at_unix_ms = 5;

  // Tool and action for caching (so task can reuse on re-run)
  string tool = 6;
  string action = 7;

  // Task ID for secondary cache key (task_id:tool)
  // When task re-executes from scratch, action string may differ slightly
  // but permission for same task/tool should still be valid
  string task_id = 8;
}

message DetachSession {
  string session_id = 1;
  bool save_context = 2;

  // Suspend configuration (for suspend operations)
  SuspendConfig suspend = 3;
}

// SuspendConfig tells the runner how to handle session suspension
message SuspendConfig {
  // Strategy to use for this suspend
  // "pause" - keep memory, pause execution (Docker pause, E2B suspend)
  // "snapshot" - create full snapshot (Firecracker, QEMU)
  // "terminate_preserve_storage" - terminate but keep PV/volume (Kubernetes)
  // "release_to_pool" - sync workspace to CAS, release runner to pool
  // "terminate" - full termination (fallback)
  string strategy = 1;

  // Sync workspace to object storage before suspend
  // Required for release_to_pool, optional for others
  bool sync_workspace = 2;

  // Create snapshot before suspend (if provider supports)
  bool save_snapshot = 3;

  // Reason for suspend (e.g., "permission_timeout", "idle_timeout", "user_request")
  string reason = 4;
}

message ApprovePermission {
  string request_id = 1;
  bool approved = 2;
  string reason = 3;

  // Set to true when this is a cached response delivered after session resume
  // Runner should process immediately without re-prompting user
  bool from_cache = 4;

  // Who approved/denied (for audit logging)
  string responded_by = 5;
  int64 responded_at_unix_ms = 6;

  // Tool and action for caching (so task can reuse on re-run)
  string tool = 7;
  string action = 8;

  // Task ID for secondary cache key (task_id:tool)
  // When task re-executes from scratch, action string may differ slightly
  // but permission for same task/tool should still be valid
  string task_id = 9;
}

message KillTask {
  string task_id = 1;
  string run_id = 2;
  string reason = 3;
}

// CreateTunnel is a SERVER-INITIATED tunnel command.
// Used for inbound tunnels where the server needs to stream TO the agent
// (e.g., desktop streaming, browser streaming, mobile emulator).
// For outbound tunnels (agent exposing ports), use CreateTunnelRequest instead.
message CreateTunnel {
  string tunnel_id = 1;
  string type = 2;          // "desktop", "browser", "ios", "android"
  int32 local_port = 3;
  string token = 4;         // One-time token (server stores hash only)

  // Direction for network policy enforcement
  // "inbound": Server/User → Agent (desktop, browser, ios, android)
  string direction = 5;

  // Expiration time (Unix milliseconds)
  int64 expires_at_unix_ms = 6;

  // Android-specific options (only used when type = "android")
  AndroidStreamOptions android_options = 7;
}

// AndroidStreamOptions configures Android screen streaming via scrcpy
message AndroidStreamOptions {
  string device_serial = 1;   // ADB device serial
  int32 max_width = 2;        // Max video width (0 = original)
  int32 max_height = 3;       // Max video height (0 = original)
  int32 max_fps = 4;          // Max frame rate (0 = 60)
  int32 bitrate = 5;          // Video bitrate in bits/s (0 = 8Mbps)
  bool audio_enabled = 6;     // Enable audio streaming (requires Android 11+)
}

// AndroidStreamStarted is sent when scrcpy stream is ready
message AndroidStreamStarted {
  string tunnel_id = 1;       // Tunnel ID from CreateTunnel
  string device_serial = 2;   // Device being streamed
  int32 width = 3;            // Actual video width
  int32 height = 4;           // Actual video height
  string video_codec = 5;     // "h264" or "h265"
  string audio_codec = 6;     // "opus" or "aac" (empty if no audio)
  bytes video_config = 7;     // H.264 SPS/PPS or H.265 VPS/SPS/PPS
  bytes audio_config = 8;     // Audio config (codec-specific)
}

// AndroidStreamData contains video or audio frame data
message AndroidStreamData {
  string tunnel_id = 1;       // Tunnel ID
  bool is_video = 2;          // true = video, false = audio
  bytes data = 3;             // H.264/H.265 NAL units or audio data
  int64 pts_us = 4;           // Presentation timestamp in microseconds
  bool is_keyframe = 5;       // true if this is a keyframe (for video)
}

// AndroidStreamStopped is sent when stream ends
message AndroidStreamStopped {
  string tunnel_id = 1;       // Tunnel ID
  string reason = 2;          // "closed", "error", "device_disconnected"
  string error = 3;           // Error message if reason is "error"
}

//------------------------------------------------------------------------------
// Desktop Streaming Messages
//------------------------------------------------------------------------------

// StartDesktopStream tells the runner to start desktop streaming.
// The runner should initialize the streaming provider (e.g., Selkies)
// and begin capturing the desktop.
message StartDesktopStream {
  string stream_id = 1;           // Server-assigned stream ID
  string session_id = 2;          // Session this stream belongs to
  StreamConfig config = 3;        // Streaming configuration
  repeated ICEServer ice_servers = 4;  // STUN/TURN servers for WebRTC
}

// StopDesktopStream tells the runner to stop desktop streaming.
message StopDesktopStream {
  string stream_id = 1;
  string reason = 2;              // Optional reason for stopping
}

// StreamConfig contains desktop streaming configuration.
message StreamConfig {
  int32 width = 1;                // Target width (0 = auto)
  int32 height = 2;               // Target height (0 = auto)
  int32 frame_rate = 3;           // Target frame rate (default: 30)
  int32 bitrate = 4;              // Target bitrate in kbps (default: 2000)
  string video_codec = 5;         // Preferred codec: "vp8", "vp9", "h264"
  string audio_codec = 6;         // Preferred audio codec: "opus"
  bool audio_enabled = 7;         // Enable audio streaming
  bool input_enabled = 8;         // Enable remote input (keyboard/mouse)
  string display = 9;             // Display to capture (e.g., ":0", "DISPLAY1")
}

// ICEServer represents a STUN/TURN server for WebRTC.
message ICEServer {
  repeated string urls = 1;       // Server URLs (stun: or turn:)
  string username = 2;            // Username for TURN authentication
  string credential = 3;          // Credential for TURN authentication
}

// DesktopStreamStarted is sent by the runner when streaming has started.
message DesktopStreamStarted {
  string stream_id = 1;
  string session_id = 2;

  // Actual streaming parameters (may differ from requested)
  int32 width = 3;
  int32 height = 4;
  int32 frame_rate = 5;
  string video_codec = 6;
  string audio_codec = 7;

  // Provider information
  string provider_name = 8;       // e.g., "selkies"
  string provider_stream_id = 9;  // Provider's internal stream ID

  int64 started_at_unix_ms = 10;
}

// DesktopStreamStopped is sent by the runner when streaming has stopped.
message DesktopStreamStopped {
  string stream_id = 1;
  string session_id = 2;
  string reason = 3;              // Reason for stopping
  int64 stopped_at_unix_ms = 4;
}

// DesktopStreamError is sent by the runner when a streaming error occurs.
message DesktopStreamError {
  string stream_id = 1;
  string session_id = 2;
  string error = 3;               // Error message
  string error_code = 4;          // Error code (e.g., "provider_unavailable")
  bool recoverable = 5;           // Whether the error is recoverable
  int64 occurred_at_unix_ms = 6;
}

//------------------------------------------------------------------------------
// Configuration Messages
//------------------------------------------------------------------------------

message AgentConfig {
  string agent = 1;         // "claude", "codex", "gemini"
  string model = 2;
  string api_key = 3;       // passed as env var to sandbox
  string base_url = 4;
  map<string, string> extra = 5;

  // Agent version for compatibility checking
  // Format: semantic version, e.g., "1.0.45"
  string agent_version = 6;
}

message SandboxConfig {
  string mode = 1;          // "runner-is-sandbox" | "runner-creates-sandbox"
  string type = 2;          // "docker", "gvisor", "namespace", "sandbox-exec", "none"
  int64 timeout_seconds = 3;
  int64 memory_mb = 4;
  double cpus = 5;
  NetworkConfig network = 6;
}

message NetworkConfig {
  string level = 1;         // "none", "allow_list", "proxy", "air_gapped"
  repeated string allowed_hosts = 2;
  // Note: Cloud metadata endpoints (169.254.169.254) are ALWAYS blocked.
  // This is not configurable for security reasons.
}

//------------------------------------------------------------------------------
// Registration
//------------------------------------------------------------------------------

message RegisterRunnerRequest {
  string name = 1;
  string hostname = 2;
  string token = 3;         // runner authentication token
  repeated string capabilities = 4;
  string sandbox_mode = 5;
  repeated string sandbox_types = 6;
  string pool_name = 7;
  map<string, string> labels = 8;
  map<string, string> annotations = 9;
}

message RegisterRunnerResponse {
  string runner_id = 1;
  bool accepted = 2;
  string message = 3;
}

message GetRunnerStatusRequest {
  string runner_id = 1;
}

message RunnerStatus {
  string runner_id = 1;
  string status = 2;
  string current_task_id = 3;
  string current_session_id = 4;
}

//------------------------------------------------------------------------------
// Logs
//------------------------------------------------------------------------------

// StreamLogsMessage wraps log stream messages with init handshake
message StreamLogsMessage {
  oneof payload {
    StreamLogsInit init = 1;
    LogEntry log_entry = 2;
  }
}

// StreamLogsInit is the REQUIRED first message in a log stream
// Server validates that runner is authorized to stream logs for this session/task
message StreamLogsInit {
  string session_id = 1;      // Session this stream is for
  string task_id = 2;         // Current task (optional, for filtering)
  string run_id = 3;          // Current run (optional, for filtering)

  // These are validated against the authenticated runner from metadata
  // If mismatch, stream is rejected with PERMISSION_DENIED
  string runner_id = 4;       // Must match x-runner-id in metadata
  string tenant_id = 5;       // Must match runner's tenant
}

// StreamLogsResponse provides feedback after stream ends
message StreamLogsResponse {
  int64 logs_received = 1;    // Total log entries received
  int64 logs_stored = 2;      // Logs successfully persisted
  int64 logs_dropped = 3;     // Logs dropped due to back-pressure or errors
  string error = 4;           // Error message if stream terminated abnormally
}

message LogEntry {
  string task_id = 1;
  string run_id = 2;
  string session_id = 3;
  string stream = 4;        // "stdout", "stderr", "system"
  string level = 5;         // "debug", "info", "warn", "error"
  string content = 6;
  int64 sequence = 7;
  int64 timestamp_unix_ms = 8;
  map<string, string> metadata = 9;

  // Tenant isolation (denormalized for efficient routing and storage)
  // Server validates this matches the StreamLogsInit tenant_id
  string tenant_id = 10;

  // Runner context
  // Server validates this matches the authenticated runner_id
  string runner_id = 11;
}

//------------------------------------------------------------------------------
// Browser Streaming Messages
//------------------------------------------------------------------------------

// RunnerBrowserMessage is sent from runner to server during browser streaming.
// First message MUST be init, subsequent messages are frame/state/stats updates.
message RunnerBrowserMessage {
  oneof payload {
    BrowserStreamInit init = 1;
    BrowserFrame frame = 2;
    BrowserStreamState state = 3;
    BrowserStreamStats stats = 4;
  }
}

// ServerBrowserMessage is sent from server to runner during browser streaming.
// Server sends input events and control commands, runner sends frames.
message ServerBrowserMessage {
  oneof payload {
    BrowserStreamStart start = 1;
    bool stop = 2;
    BrowserInputEvent input = 3;
    BrowserStreamControl control = 4;
  }
}

// BrowserStreamInit initializes a browser stream session.
// Sent as the first message from runner when starting a browser stream.
message BrowserStreamInit {
  string stream_id = 1;        // Stream ID from streaming.Manager
  string session_id = 2;       // Associated session
  string runner_id = 3;        // Sending runner

  // Browser info
  string browser_product = 4;  // e.g., "Chrome/120.0.0.0"
  string cdp_version = 5;      // CDP protocol version

  // Initial viewport dimensions
  int32 viewport_width = 6;
  int32 viewport_height = 7;
}

// BrowserFrame represents a single captured browser frame.
message BrowserFrame {
  bytes data = 1;              // Encoded image data (JPEG/PNG/WebP)
  string format = 2;           // "jpeg", "png", "webp"
  int32 width = 3;
  int32 height = 4;
  uint64 sequence = 5;         // Monotonic frame number
  int64 timestamp_unix_ms = 6; // Capture timestamp

  // Optional metadata (e.g., page URL, title)
  map<string, string> metadata = 7;
}

// BrowserStreamState represents stream state changes.
message BrowserStreamState {
  // State values: "idle", "starting", "active", "paused", "stopping", "stopped", "error"
  string state = 1;
  string error = 2;            // Error message if state is "error"
  int64 timestamp_unix_ms = 3;
}

// BrowserStreamStats contains streaming statistics.
message BrowserStreamStats {
  uint64 frames_sent = 1;
  uint64 frames_dropped = 2;
  uint64 bytes_sent = 3;
  double average_fps = 4;
  double current_fps = 5;
  int32 average_latency_ms = 6;
  int64 started_at_unix_ms = 7;
}

// BrowserStreamStart tells the runner to start streaming with the given options.
message BrowserStreamStart {
  BrowserStreamOptions options = 1;
  string target_url = 2;       // Optional URL to navigate to before streaming
}

// BrowserStreamOptions configures stream parameters.
message BrowserStreamOptions {
  int32 quality = 1;           // JPEG quality 1-100 (default: 80)
  int32 max_fps = 2;           // Max frames per second (default: 30)
  string format = 3;           // "jpeg", "png", "webp" (default: "jpeg")
  int32 max_width = 4;         // Max frame width (0 = no limit)
  int32 max_height = 5;        // Max frame height (0 = no limit)
  int32 every_nth_frame = 6;   // Capture every Nth frame (default: 1)
}

// BrowserStreamControl contains control commands for the stream.
message BrowserStreamControl {
  oneof command {
    bool pause = 1;                          // true = pause, false = resume
    BrowserNavigateRequest navigate = 2;     // Navigate to URL
    string switch_tab = 3;                   // Tab ID to switch to
    BrowserStreamOptions update_options = 4; // Update stream options
  }
}

// BrowserNavigateRequest requests browser navigation.
message BrowserNavigateRequest {
  string url = 1;
  string referrer = 2;
}

// BrowserInputEvent represents input from client to browser.
message BrowserInputEvent {
  // Event type: "mouseMove", "mouseDown", "mouseUp", "mouseWheel", "keyDown", "keyUp"
  string type = 1;
  int64 timestamp_unix_ms = 2;

  oneof event {
    BrowserMouseEvent mouse = 3;
    BrowserKeyboardEvent keyboard = 4;
  }
}

// BrowserMouseEvent represents mouse input.
message BrowserMouseEvent {
  double x = 1;              // Viewport X coordinate
  double y = 2;              // Viewport Y coordinate
  string button = 3;         // "left", "middle", "right", "none"
  int32 click_count = 4;     // 1 = single, 2 = double, 3 = triple
  double delta_x = 5;        // Wheel scroll X
  double delta_y = 6;        // Wheel scroll Y
  BrowserModifiers modifiers = 7;
}

// BrowserKeyboardEvent represents keyboard input.
message BrowserKeyboardEvent {
  string key = 1;            // Key value, e.g., "a", "Enter", "Escape"
  string code = 2;           // Physical key code, e.g., "KeyA", "Enter"
  string text = 3;           // Generated text (for keypress)
  BrowserModifiers modifiers = 4;
}

// BrowserModifiers represents keyboard modifier states.
message BrowserModifiers {
  bool alt = 1;
  bool ctrl = 2;
  bool meta = 3;
  bool shift = 4;
}

// BrowserTabInfo provides information about a browser tab.
message BrowserTabInfo {
  string id = 1;
  string title = 2;
  string url = 3;
  string type = 4;           // "page", "background_page", "service_worker", etc.
}
