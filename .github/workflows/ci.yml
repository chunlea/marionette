name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Pinned so a CI run is reproducible and an upstream release cannot break the
  # build overnight. protoc-gen-go tracks google.golang.org/protobuf in go.mod;
  # bump them together.
  BUF_VERSION: v1.72.0
  PROTOC_GEN_GO_VERSION: v1.36.11
  PROTOC_GEN_GO_GRPC_VERSION: v1.6.2
  GOLANGCI_LINT_VERSION: v2.13.1
  # No v prefix: the release tag is v${ACTIONLINT_VERSION} but the asset name is
  # not.
  ACTIONLINT_VERSION: 1.7.7

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      image: golang:1.25-bookworm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # buf breaking compares against origin/main; a shallow clone has no
          # such ref.
          fetch-depth: 0

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y curl
          # Install buf
          curl -sSL "https://github.com/bufbuild/buf/releases/download/${BUF_VERSION}/buf-Linux-x86_64" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf
          # Install golangci-lint
          curl -sSfL "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_LINT_VERSION}/install.sh" | sh -s -- -b /usr/local/bin "${GOLANGCI_LINT_VERSION}"

      - name: Install protoc plugins
        run: |
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"

      - name: Buf lint
        run: buf lint

      - name: Buf breaking change detection
        # Skipped on main itself, where there is nothing to compare against.
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=main'

      - name: Generate protobuf
        run: buf generate

      - name: golangci-lint
        run: golangci-lint run --timeout=5m ./...

  actions:
    name: Workflow lint
    runs-on: ubuntu-latest
    # The release workflow cannot be exercised without pushing a tag, so its
    # syntax, expressions and shell are checked here instead.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" actionlint

      - name: actionlint
        # shellcheck is preinstalled on the runner and actionlint picks it up,
        # so this lints the shell inside every run: block as well.
        run: |
          "${RUNNER_TEMP}/actionlint" -color

  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: golang:1.25-bookworm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y curl
          # Install buf
          curl -sSL "https://github.com/bufbuild/buf/releases/download/${BUF_VERSION}/buf-Linux-x86_64" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf

      - name: Install protoc plugins
        run: |
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"

      - name: Generate protobuf
        run: buf generate

      - name: Run tests
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          MARIONETTE_RUNNER_TOKEN: test_token

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
        if: always()

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        # Pinned to 9 deliberately: pnpm 10+ fails the install on
        # ERR_PNPM_IGNORED_BUILDS. Keep in sync with the packageManager field
        # in web/package.json.
        #
        # The action itself stops at v5, the first major on Node 24, rather
        # than v6: v6 replaced the installer with a pnpm-11 bootstrap that
        # self-updates down to the requested version, which is a new path for
        # the old version we pin here.
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the generated API types match the OpenAPI documents
        # The Go side has its own drift checks for the documents themselves
        # (TestOpenAPIDocumentIsUpToDate and TestAdminOpenAPIDocumentIsUpToDate,
        # in the test job); this one catches a document that changed without
        # the TypeScript being regenerated from it.
        run: |
          pnpm generate:api
          git diff --exit-code src/types/api.gen.ts src/types/admin.gen.ts \
            || { echo "::error::run 'pnpm generate:api' and commit the generated types"; exit 1; }

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        # `pnpm build` runs vite build and then the typecheck, in that order:
        # the router plugin writes src/routeTree.gen.ts during the build and
        # tsc needs it. It also exercises the bundle the server embeds, which
        # nothing in CI used to do.
        run: pnpm build

  schema:
    name: Schema drift
    runs-on: ubuntu-latest
    # No job container: the script drives Docker itself so CI and a developer's
    # `make schema` render byte-identical output.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check docs/schema.sql matches migrations/
        run: make schema-check

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    container:
      image: golang:1.25-bookworm
    # Recording, plus a comparison that reports and does not fail. The gate
    # itself stays off here for two reasons, in order of weight:
    #
    #   1. test/perf/BASELINE.md was recorded on an Apple M4 Max laptop. This
    #      job runs on a shared 4-core runner inside a container, so most of
    #      any ratio it prints is the hardware gap, not a code change.
    #   2. Even on the quiet baseline machine, a run competing with other work
    #      came in 2.85x over its own steady state — see the gate section of
    #      BASELINE.md. A shared runner is never quieter than that.
    #
    # A gate on that is a gate everyone learns to ignore. `make bench-gate`
    # runs the same comparison with the gate ON, where the comparison is
    # between two runs on the same machine and the ratio means something.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y curl
          curl -sSL "https://github.com/bufbuild/buf/releases/download/${BUF_VERSION}/buf-Linux-x86_64" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf

      - name: Install protoc plugins
        run: |
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"

      - name: Generate protobuf
        run: buf generate

      # No -race: the detector changes timing by an order of magnitude, so a
      # benchmark under it measures the detector.
      #
      # Core only. The store benchmarks need a PostgreSQL container, and this
      # job already runs inside one; test/perf/store skips itself cleanly when
      # there is no Docker daemon to reach.
      - name: Record the machine
        run: |
          {
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit: ${GITHUB_SHA}"
            echo "runner: ${RUNNER_OS} ${RUNNER_ARCH}"
            echo "cpus: $(nproc)"
            echo "go: $(go version)"
            echo
          } > bench.txt

      # -count 3 so the recorded number can be a median. A single sample is
      # the one most likely to be the cold outlier, which is exactly the
      # sample a comparison should not be built on.
      #
      # pipefail so a benchmark that fails to build fails the step instead of
      # leaving an empty bench.txt for the comparison below to skip over.
      - name: Run benchmarks
        shell: bash
        run: |
          set -euo pipefail
          go test -run '^$' -bench . -benchmem -benchtime 2s -count 3 ./pkg/server/core/... | tee -a bench.txt

      # Report only: benchcmp exits non-zero solely when it cannot do its job
      # (an unreadable input), never on a ratio, because -gate is not passed.
      # A missing or unreadable baseline prints a SKIP line and exits 0.
      #
      # continue-on-error is spelled out even though the job-level setting
      # above already absorbs a failure here: it is what has to change first
      # if this job is ever flipped to gating, and leaving it implicit is how
      # a gate ends up tolerant without anyone deciding that.
      - name: Compare against the baseline
        continue-on-error: false
        shell: bash
        run: |
          set -euo pipefail
          go run ./test/perf/benchcmp -baseline test/perf/BASELINE.md -bench bench.txt | tee -a bench.txt

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: bench.txt
        if: always()

  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: golang:1.25-bookworm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y curl
          # Install buf
          curl -sSL "https://github.com/bufbuild/buf/releases/download/${BUF_VERSION}/buf-Linux-x86_64" -o /usr/local/bin/buf
          chmod +x /usr/local/bin/buf

      - name: Install protoc plugins
        run: |
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"

      - name: Generate protobuf
        run: buf generate

      - name: Build binaries
        run: |
          mkdir -p bin
          go build -ldflags "-s -w" -o bin/server ./cmd/server
          go build -ldflags "-s -w" -o bin/agent ./cmd/agent
          go build -ldflags "-s -w" -o bin/mctl ./cmd/mctl

      - name: Verify binaries exist
        run: |
          ls -la bin/
          ./bin/server --help || true
          ./bin/agent --help || true
          ./bin/mctl --help || true
