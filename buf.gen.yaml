version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/chunlea/marionette/gen/proto
plugins:
  - local: protoc-gen-go
    out: gen/proto
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/proto
    opt:
      - paths=source_relative
