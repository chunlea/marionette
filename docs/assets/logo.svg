<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Puppet cross control bar -->
  <rect x="25" y="15" width="50" height="6" rx="3" fill="url(#grad)"/>
  <rect x="47" y="15" width="6" height="20" rx="3" fill="url(#grad)"/>
  <!-- Strings -->
  <line x1="30" y1="21" x2="35" y2="45" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="50" y1="35" x2="50" y2="50" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="70" y1="21" x2="65" y2="45" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="2,2"/>
  <!-- Robot/Agent body -->
  <rect x="35" y="45" width="30" height="25" rx="4" fill="url(#grad)"/>
  <!-- Robot head -->
  <rect x="40" y="50" width="20" height="15" rx="2" fill="#fff"/>
  <!-- Robot eyes -->
  <circle cx="46" cy="57" r="3" fill="#7c3aed"/>
  <circle cx="54" cy="57" r="3" fill="#7c3aed"/>
  <!-- Robot antenna -->
  <line x1="50" y1="45" x2="50" y2="40" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="50" cy="38" r="3" fill="#a855f7"/>
  <!-- Robot legs -->
  <rect x="38" y="70" width="8" height="15" rx="2" fill="url(#grad)"/>
  <rect x="54" y="70" width="8" height="15" rx="2" fill="url(#grad)"/>
</svg>
